# ==============================================================================
# KONFIGURASI NGINX UNTUK AAPANEL (Website Settings -> URL Rewrite / Config)
# ==============================================================================
# Tempatkan aturan ini di menu "URL rewrite" pada pengaturan website aaPanel Anda,
# atau gabungkan ke dalam file konfigurasi Nginx website.

# 1. Arahkan seluruh endpoint API ke router.php
location ^~ /api/ {
    try_files $uri $uri/ /router.php?$query_string;
}

# 2. Aset Statis (CSS, JS, Fonts, Images) dari folder public
location ~* \.(css|js|json|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    root /www/wwwroot/DOMAIN_ANDA/public;
    try_files $uri $uri/ =404;
    expires 7d;
    access_log off;
}

# 3. Default route / fallback ke public/index.html (Single Page App)
location / {
    root /www/wwwroot/DOMAIN_ANDA/public;
    index index.html;
    try_files $uri $uri/ /index.html;
}

# 4. Keamanan: Blokir akses langsung ke file sensitif (.env, .git, sqlite, config)
location ~ /\.(env|git|ht) {
    deny all;
    return 404;
}

location ~* \.(sqlite|sql|log)$ {
    deny all;
    return 404;
}
