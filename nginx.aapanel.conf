# ==============================================================================
# SAKUCI PLAYGROUND - NGINX CONFIGURATION (aaPanel URL Rewrite)
# ==============================================================================
# Gunakan aturan ini jika website aaPanel Anda menggunakan Web Server NGINX.
# Masuk ke: aaPanel -> Website -> klik domain -> menu "URL rewrite".

# 1. Arahkan semua request dinamis dan rute ke index.php
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# 2. Keamanan: Blokir akses langsung ke file sensitif
location ~ /\.(env|git|ht) {
    deny all;
    return 404;
}

location ~* \.(sqlite|sql|log)$ {
    deny all;
    return 404;
}
